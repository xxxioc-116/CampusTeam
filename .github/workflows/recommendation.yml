name: Recommendation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  recommendation-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.txt
      - run: python -m ruff check analytics tests
      - run: python -m coverage run -m unittest discover -s tests
      - run: python -m coverage report
      - run: python -m build --no-isolation
      - run: python -m analytics.experiment > experiment.json
      - uses: actions/upload-artifact@v4
        with:
          name: recommendation-experiment
          path: experiment.json
      - name: Validate authenticated recommendation API and migrations
        if: hashFiles('manage.py') != ''
        env:
          DJANGO_DEBUG: 'true'
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python -m coverage run --source=analytics,core --omit='*/tests/*,*/migrations/*,*/management/*,analytics/experiment.py' manage.py test core tests
          python -m coverage report --fail-under=80
