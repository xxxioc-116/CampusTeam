name: Recommendation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  recommendation-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.14.2 coverage==7.6.12 build==1.3.0
      - run: python -m ruff check analytics tests
      - run: python -m coverage run -m unittest discover -s tests
      - run: python -m coverage report
      - run: python -m build
      - run: python -m analytics.experiment > experiment.json
      - uses: actions/upload-artifact@v4
        with:
          name: recommendation-experiment
          path: experiment.json
