[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campusteam-recommendation"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["analytics*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["analytics.recommendation"]

[tool.coverage.report]
fail_under = 90
show_missing = true
